<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matinée japonais</title>
<style>
:root{
  --bg:#faf9f6;--fg:#1d1d1f;--mut:#6b6b70;--card:#ffffff;--line:#e4e2dc;
  --wk:#d6336c;--anki:#2f6fde;--gram:#e8890c;--lect:#2b9a66;--ecou:#7c4dcc;--jlpt:#c0392b;--cahier:#5d6b78;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#151517;--fg:#ececee;--mut:#9a9aa0;--card:#1f1f22;--line:#333338}
}
:root[data-theme="dark"]{--bg:#151517;--fg:#ececee;--mut:#9a9aa0;--card:#1f1f22;--line:#333338}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:700px){.wrap{grid-template-columns:200px minmax(0,1fr);align-items:start}}
aside h2{font-size:.85rem;color:var(--mut);font-weight:600;margin:0 0 8px}
aside ul{list-style:none;padding:0;margin:0}
aside li{padding:6px 10px;margin-bottom:6px;font-size:.9rem}
aside .note{font-size:.8rem;color:var(--mut);margin:12px 0 0}
h1{font-size:1.4rem;margin:0 0 4px}
.date{color:var(--mut);margin:0 0 20px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px}
label{font-size:.85rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);width:96px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;border:0;border-radius:6px;background:var(--fg);color:var(--bg);cursor:pointer}
ol{list-style:none;padding:0;margin:0}
li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.h{font-variant-numeric:tabular-nums;color:var(--mut);width:3.2em;flex:none}
.n{flex:1;font-weight:600}
.t{display:block;font-size:.75rem;font-weight:400;color:var(--mut)}
aside li{display:block}
.d{color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
li.pause{--c:var(--line);padding:4px 12px;font-size:.85rem;color:var(--mut)}
li.pause .n{font-weight:400}
li.on{outline:2px solid var(--c)}
li.next .play{outline:2px solid var(--fg);outline-offset:2px}
.play{flex:none;width:34px;height:34px;padding:0;border-radius:50%;font-size:.8rem}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.timer{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:20px}
.timer .ph{font-size:.85rem;color:var(--mut)}
.timer .nm{font-weight:600}
.clock{font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0 8px}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.timer input[type=range]{width:160px}
.timer select{width:auto}
iframe#yt{display:block;margin-top:10px;width:100%;max-width:356px;height:200px;border:0;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Matinée japonais</h1>
<p class="date" id="date"></p>

<div class="wrap">
<aside>
  <h2>Catégories</h2>
  <ul id="cats"></ul>
  <p class="note">Sessions officielles JLPT : jours fixes, voir l'agenda.</p>
</aside>

<div>
<div class="ctl">
  <label>Début <input type="time" id="start" value="09:00"></label>
  <label>Durée (min) <input type="number" id="total" value="180" min="15" step="5"></label>
  <label>WaniKani (min) <input type="number" id="wk" value="30" min="0" step="5"></label>
  <label>Pause (min) <input type="number" id="pause" value="15" min="0" step="5"></label>
  <button id="roll">Nouveau tirage</button>
</div>

<section class="timer">
  <div class="ph" id="tPhase">Appuie sur ▶ devant une session pour la lancer.</div>
  <div class="nm" id="tName"></div>
  <div class="clock" id="tClock">--:--</div>
  <div class="tb">
    <button id="tToggle" class="ghost" disabled>Pause</button>
    <button id="tSkip" class="ghost" hidden>Passer la pause</button>
    <button id="tStop" class="ghost" disabled>Arrêter</button>
  </div>
  <div class="tb">
    <label>Musique <select id="music"></select></label>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="50"></label>
  </div>
  <p class="ph" id="ytErr" hidden>Musique indisponible ici. <a id="ytLink" href="#" target="_blank" rel="noopener">Ouvrir la musique dans un onglet</a></p>
  <iframe id="yt" title="Musique lofi" allow="autoplay; encrypted-media"></iframe>
</section>

<ol id="plan"></ol>
</div>
</div>
</main>

<script>
const CAT = [
  {k:"anki",   n:"Anki",                         t:"Phrases · Vocabulaire · Lecture des kanji · Sens des kanji"},
  {k:"gram",   n:"Grammaire",                    t:"Grammaire"},
  {k:"lect",   n:"Lecture",                      t:"Lecture · Kanji"},
  {k:"ecou",   n:"Anime, séries, documentaires", t:"Écoute · Vocabulaire"},
  {k:"cahier", n:"Cahiers",                      t:"Trace écrite · Grammaire · Radicaux · Kanji"}
];
const WK = {k:"wk", n:"WaniKani", t:"Radicaux · Kanji · Vocabulaire"};
const MAX = 2;           // occurrences max par catégorie (hors WaniKani)
const MIN_B = 15, MAX_B = 30, STEP = 5;

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pick(a,r){return a[Math.floor(r()*a.length)]}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// Choisit le nombre de blocs tirés : les pauses sont comprises dans la durée totale
function layout(rest, pause, wk, r){
  const ns = [];
  for(let n=1; n<=CAT.length*MAX; n++){
    const w = rest - pause*(wk ? n : n-1);
    if(w >= n*MIN_B && w <= n*MAX_B) ns.push(n);
  }
  let n;
  if(ns.length) n = ns[Math.floor(r()*Math.min(ns.length, 4))];
  else n = rest - (wk ? pause : 0) < MIN_B ? 1 : CAT.length*MAX;
  return split(rest - pause*(wk ? n : n-1), n, r);
}

// Découpe `work` minutes en n blocs de 15 à 30 min (pas de 5)
function split(work, n, r){
  if(work <= 0) return [];
  if(work < MIN_B) return [work];
  const cap = n*MAX_B >= work ? MAX_B : Infinity;
  const d = Array(n).fill(MIN_B);
  let extra = work - n*MIN_B;
  d[0] += extra % STEP; extra -= extra % STEP;
  while(extra > 0){
    const free = d.map((v,i)=>i).filter(i=>d[i]+STEP <= cap);
    d[pick(free.length ? free : d.map((v,i)=>i), r)] += STEP;
    extra -= STEP;
  }
  return d;
}

// Tire n catégories : 2 fois max chacune, jamais deux fois de suite
function categories(n, r){
  let best = null;
  for(let t=0; t<50; t++){
    const cnt = {}, seq = [];
    for(let i=0; i<n; i++){
      const ok = CAT.filter(c => (cnt[c.k]||0) < MAX && (!seq.length || seq[seq.length-1].k !== c.k));
      if(!ok.length) break;
      const c = pick(ok, r); cnt[c.k] = (cnt[c.k]||0) + 1; seq.push(c);
    }
    if(seq.length === n) return seq;
    if(!best || seq.length > best.length) best = seq;
  }
  return best;
}

function build(date, roll, total, wk, pause){
  const r = rng(hash(date + "#" + roll));
  wk = Math.max(0, Math.min(wk, total));
  const d = layout(total - wk, pause, wk > 0, r);
  const cats = categories(d.length, r);
  const plan = cats.map((c,i) => ({...c, m:d[i]}));
  if(wk > 0) plan.unshift({...WK, m:wk});
  return plan;
}

function hm(min){return String(Math.floor(min/60)%24).padStart(2,"0")+"h"+String(min%60).padStart(2,"0")}

const $ = id => document.getElementById(id);
const DATE = today();

let PLAN = [];   // blocs de travail du tirage affiché (sans les pauses)

function render(){
  const total = parseInt($("total").value,10) || 0;
  const wk = parseInt($("wk").value,10) || 0;
  const pause = Math.max(0, parseInt($("pause").value,10) || 0);
  const roll = parseInt(get("roll-"+DATE)||"0",10);
  const [h,m] = ($("start").value || "09:00").split(":").map(Number);
  let t = h*60 + m;
  PLAN = build(DATE, roll, total, wk, pause);
  $("plan").innerHTML = PLAN.map((b,i) => {
    let li = "";
    if(i > 0 && pause > 0){ li += `<li class="pause"><span class="h">${hm(t)}</span><span class="n">Pause</span><span class="d">${pause} min</span></li>`; t += pause; }
    li += `<li data-i="${i}" style="--c:var(--${b.k})"><span class="h">${hm(t)}</span><span class="n"><span class="t">${b.t}</span>${b.n}</span><span class="d">${b.m} min</span><button class="play" data-i="${i}" aria-label="Lancer ${b.n}">▶</button></li>`;
    t += b.m; return li;
  }).join("");
  mark();
  set("matinee-cfg", JSON.stringify({start:$("start").value, total, wk, pause}));
}

// ---- Minuteur + musique lofi ----
// Radios en direct de Lofi Girl (vérifiées le 2026-10-23).
// Si l'une s'arrête, reprendre son identifiant sur youtube.com/@LofiGirl/streams
const RADIOS = [
  {id:"rFZHOHl-L8A", n:"Lofi hip hop"},
  {id:"1Tl2FtV06qo", n:"Lofi asiatique"},
  {id:"E2vONfzoyRI", n:"Jazz lofi"},
  {id:"N0snMcR6aaA", n:"Piano calme"},
  {id:"E_XmwjgRLz8", n:"Guitare calme"},
  {id:"jXAEIWcGXwE", n:"Musique classique"}
];
const radio = () => RADIOS.find(x => x.id === $("music").value) || RADIOS[0];
let yt = null, ac = null;
const T = {i:-1, phase:"idle", end:0, left:0, paused:false, next:-1, block:null};

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", {events:{
    onReady: e => e.target.setVolume(+$("vol").value),
    onError: () => { $("ytErr").hidden = false; }
  }});
};
function music(on){ try{ if(yt && yt.playVideo) on ? yt.playVideo() : yt.pauseVideo(); }catch(e){} }

function chime(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach((d,k) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = [660, 880, 990][k];
      g.gain.setValueAtTime(.0001, ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.3, ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d+.6);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.65);
    });
  }catch(e){}
}

function mark(){
  document.querySelectorAll("#plan li[data-i]").forEach(li => {
    const i = +li.dataset.i;
    li.classList.toggle("on", T.phase === "work" && i === T.i);
    li.classList.toggle("next", T.phase !== "work" && i === T.next);
  });
}

function play(i){
  const b = PLAN[i]; if(!b) return;
  if(ac && ac.state === "suspended") ac.resume();
  T.i = i; T.block = b; T.phase = "work"; T.paused = false; T.next = -1;
  T.end = Date.now() + b.m*60000;
  music(true); show(); mark();
}

function finish(){
  chime();
  const pause = Math.max(0, parseInt($("pause").value,10) || 0);
  if(T.phase === "work"){
    music(false);
    T.next = T.i + 1 < PLAN.length ? T.i + 1 : -1;
    if(T.next >= 0 && pause > 0){ T.phase = "break"; T.end = Date.now() + pause*60000; }
    else T.phase = T.next >= 0 ? "wait" : "done";
  } else T.phase = "wait";
  show(); mark();
}

function stop(){ music(false); Object.assign(T, {i:-1, phase:"idle", paused:false, next:-1, block:null}); show(); mark(); }

function mmss(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

function show(){
  const left = T.paused ? T.left : T.end - Date.now();
  const nx = PLAN[T.next];
  const txt = {
    idle:  ["Appuie sur ▶ devant une session pour la lancer.", ""],
    work:  [T.paused ? "Session en pause" : "Session en cours", T.block && T.block.n],
    break: ["Pause", nx ? "Ensuite : " + nx.n : ""],
    wait:  ["Pause terminée, appuie sur ▶ pour lancer la suite.", nx ? "Ensuite : " + nx.n : ""],
    done:  ["Matinée terminée.", ""]
  }[T.phase];
  $("tPhase").textContent = txt[0];
  $("tName").textContent = txt[1] || "";
  const run = T.phase === "work" || T.phase === "break";
  $("tClock").textContent = run ? mmss(left) : "--:--";
  $("tToggle").disabled = !run;
  $("tToggle").textContent = T.paused ? "Reprendre" : "Pause";
  $("tSkip").hidden = T.phase !== "break";
  $("tStop").disabled = T.phase === "idle";
  document.title = run ? mmss(left) + " · " + (T.phase === "work" ? T.block.n : "Pause") : "Matinée japonais";
}

setInterval(() => {
  if((T.phase === "work" || T.phase === "break") && !T.paused){
    if(T.end - Date.now() <= 0) finish(); else show();
  }
}, 250);

$("plan").addEventListener("click", e => { const btn = e.target.closest(".play"); if(btn) play(+btn.dataset.i); });
$("tToggle").onclick = () => {
  if(T.paused){ T.end = Date.now() + T.left; T.paused = false; if(T.phase === "work") music(true); }
  else { T.left = T.end - Date.now(); T.paused = true; music(false); }
  show();
};
$("tSkip").onclick = () => { T.end = Date.now(); };
$("tStop").onclick = stop;
$("vol").addEventListener("input", e => { try{ yt && yt.setVolume(+e.target.value); }catch(err){} });
$("music").innerHTML = RADIOS.map(x => `<option value="${x.id}">${x.n}</option>`).join("");
$("music").value = get("matinee-radio") || RADIOS[0].id;
$("ytLink").href = "https://www.youtube.com/watch?v=" + radio().id;
$("music").addEventListener("change", () => {
  set("matinee-radio", radio().id);
  $("ytLink").href = "https://www.youtube.com/watch?v=" + radio().id;
  try{ if(yt && yt.loadVideoById) (T.phase === "work" && !T.paused) ? yt.loadVideoById(radio().id) : yt.cueVideoById(radio().id); }catch(e){}
});
$("yt").src = "https://www.youtube.com/embed/" + radio().id + "?enablejsapi=1&playsinline=1&rel=0" + (location.origin.startsWith("http") ? "&origin=" + encodeURIComponent(location.origin) : "");
{ const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc); }

$("cats").innerHTML = [WK, ...CAT].map(c => `<li style="--c:var(--${c.k})"><span class="t">${c.t}</span>${c.n}</li>`).join("");
$("date").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
try{const c = JSON.parse(get("matinee-cfg")||"null"); if(c){$("start").value=c.start; $("total").value=c.total; $("wk").value=c.wk; if(c.pause!=null) $("pause").value=c.pause}}catch(e){}
$("roll").onclick = () => {set("roll-"+DATE, String(parseInt(get("roll-"+DATE)||"0",10)+1)); render()};
["start","total","wk","pause"].forEach(id => $(id).addEventListener("change", render));
render();
</script>
</body>
</html>
